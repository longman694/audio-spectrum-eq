<!DOCTYPE html>
<html class="sl-theme-dark">
    <head>
        <title>Tone Generator + Native EQ with Graph</title>
        <style>
            body {
                color: #EEEEEE;
                background-color: #030303;
                font-family: sans-serif;
                margin: 0;
                padding: 20px;
                width: 100%;
                box-sizing: border-box;
            }
            #control-container {
                width: 100%;
                display: flex;
                flex-direction: column;
                gap: 20px;
                margin-top: 10px;
                background-color: #111;
                padding: 20px;
                border-radius: 8px;
                box-sizing: border-box;
            }
            .osc-group {
                display: flex;
                padding: 15px;
                background-color: #1a1a1a;
                border-radius: 6px;
                border: 1px solid #333;
            }
            .volume-group {
                width: 250px;
                flex-shrink: 0;
                display: flex;
                flex-direction: column;
                gap: 5px;
                padding-right: 30px; 
                box-sizing: border-box;
            }
            .frequency-group {
                flex-grow: 1;
                display: flex;
                flex-direction: column;
                gap: 5px;
            }
            .freq-label {
                font-family: monospace;
                color: #00ccff;
                font-size: 1.1em;
            }
            .controls-row {
                display: flex;
                align-items: center;
                gap: 20px;
                flex-wrap: wrap;
            }
            .eq-container {
                margin-top: 20px;
                background-color: #111;
                padding: 20px;
                border-radius: 8px;
            }
            .eq-header {
                display: flex;
                align-items: center;
                gap: 15px;
                margin-bottom: 15px;
            }
            .eq-header h3 {
                margin: 0;
                color: #888;
            }
            
            /* Graphic EQ Canvas */
            #eq-canvas-container {
                width: 100%;
                margin-bottom: 20px;
                position: relative;
            }
            #eq-curve {
                width: 100%;
                height: 250px; /* Slightly taller to accommodate labels */
                background-color: #1a1a1a;
                border-radius: 6px;
                border: 1px solid #333;
                display: block;
            }

            /* Graphic EQ Sliders Styles */
            .eq-sliders {
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
                background-color: #1a1a1a;
                padding: 20px;
                border-radius: 6px;
                border: 1px solid #333;
                overflow-x: auto;
            }
            .eq-band {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 8px;
                width: 60px;
            }
            .eq-slider-wrapper {
                height: 160px;
                display: flex;
                align-items: center;
                justify-content: center;
                margin: 10px 0;
            }
            input[type=range].vertical-slider {
                writing-mode: bt-lr; /* IE/Edge */
                -webkit-appearance: slider-vertical; /* WebKit */
                width: 8px;
                height: 150px;
                padding: 0 5px;
                background: transparent;
                cursor: pointer;
            }
            
            .input-group {
                display: flex;
                flex-direction: column;
                align-items: center;
                width: 100%;
            }
            .eq-param-label {
                font-size: 0.7em;
                color: #888;
                margin-bottom: 3px;
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }
            .eq-input {
                width: 100%;
                background: #222;
                color: #00ccff;
                border: 1px solid #444;
                border-radius: 4px;
                padding: 4px;
                text-align: center;
                font-size: 0.85em;
                font-family: monospace;
                box-sizing: border-box;
                outline: none;
                transition: border-color 0.2s;
            }
            .eq-input:focus {
                border-color: #00ccff;
            }
            .eq-input::-webkit-outer-spin-button,
            .eq-input::-webkit-inner-spin-button {
                -webkit-appearance: none;
                margin: 0;
            }
            .eq-input[type=number] {
                -moz-appearance: textfield;
            }

            footer {
                margin-top: 30px;
                margin-bottom: 20px;
                color: #666;
                font-size: 0.9em;
                text-align: center;
            }
            footer a {
                color: #888;
                text-decoration: none;
                transition: color 0.2s;
            }
            footer a:hover {
                color: #00ccff;
            }
        </style>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.0/cdn/themes/dark.css" />
        <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.0/cdn/shoelace-autoloader.js"></script>
    </head>
    <body>
        
        <div id="control-container">
            <div class="controls-row">
                <sl-button variant="success" size="large" id="btn_start">
                    <sl-icon slot="prefix" name="play-fill"></sl-icon> Start Generator
                </sl-button>
                <sl-button variant="danger" size="large" style="display: none;" id="btn_destroy">
                    <sl-icon slot="prefix" name="stop-fill"></sl-icon> Stop Generator
                </sl-button>
                <sl-switch id="toggle_osc2">Enable Oscillator 2</sl-switch>
            </div>

            <div id="osc1-controls" class="osc-group">
                <div class="volume-group">
                    <label>Osc 1 Volume: <span id="label_vol1" class="freq-label">50%</span></label>
                    <sl-range id="slider_vol1" min="0" max="100" value="50"></sl-range> 
                </div>
                <div class="frequency-group">
                    <label>Osc 1 Frequency: <span id="label_osc1" class="freq-label">440.0 Hz</span></label>
                    <sl-range id="slider_osc1" min="0" max="1000" value="439"></sl-range> 
                </div>
            </div>

            <div id="osc2-controls" class="osc-group" style="display: none;">
                <div class="volume-group">
                    <label>Osc 2 Volume: <span id="label_vol2" class="freq-label">50%</span></label>
                    <sl-range id="slider_vol2" min="0" max="100" value="50"></sl-range>
                </div>
                <div class="frequency-group">
                    <label>Osc 2 Frequency: <span id="label_osc2" class="freq-label">1000.0 Hz</span></label>
                    <sl-range id="slider_osc2" min="0" max="1000" value="565"></sl-range>
                </div>
            </div>
        </div>

        <div class="eq-container">
            <div class="eq-header">
                <h3>10-Band Graphic Equalizer</h3>
            </div>
            
            <div id="eq-canvas-container">
                <canvas id="eq-curve"></canvas>
            </div>

            <div id="eq-ui-container">
                <div class="eq-sliders" id="eq-sliders"></div>
            </div>
        </div>

        <footer>
            <a href="https://github.com/longman694/audio-spectrum-eq" target="_blank">
                <sl-icon name="github"></sl-icon> View on GitHub
            </a>
        </footer>

        <script type="module">
            // DOM Elements
            const startButton   = document.getElementById('btn_start');
            const destroyButton = document.getElementById('btn_destroy');
            const toggleOsc2    = document.getElementById('toggle_osc2');
            const osc2Controls  = document.getElementById('osc2-controls');
            const sliderOsc1    = document.getElementById('slider_osc1');
            const sliderOsc2    = document.getElementById('slider_osc2');
            const labelOsc1     = document.getElementById('label_osc1');
            const labelOsc2     = document.getElementById('label_osc2');
            const sliderVol1    = document.getElementById('slider_vol1');
            const sliderVol2    = document.getElementById('slider_vol2');
            const labelVol1     = document.getElementById('label_vol1');
            const labelVol2     = document.getElementById('label_vol2');
            const eqSliders     = document.getElementById('eq-sliders');
            
            // Canvas Elements
            const canvas = document.getElementById('eq-curve');
            const ctx = canvas.getContext('2d');

            // Global Audio Variables
            let audioContext;
            let osc1, osc2;
            let gain1, gain2;
            let isPlaying = false;
            
            // Native EQ Variables
            let eqBus; 
            const eqFilters = [];
            const EQ_FREQS = [31, 62, 125, 250, 500, 1000, 2000, 4000, 8000, 16000];

            const MIN_FREQ = 20;
            const MAX_FREQ = 20000;

            // --- IMMEDIATE INITIALIZATION ---
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            
            // Force the context to initialize its sample rate for the math to work before playing
            if (audioContext.state === 'suspended') {
                audioContext.resume().then(() => {
                    audioContext.suspend(); 
                    drawEQCurve(); // Redraw once sample rate is guaranteed
                });
            }

            eqBus = audioContext.createGain();

            // Build the EQ filter chain and UI
            EQ_FREQS.forEach((freq, index) => {
                const filter = audioContext.createBiquadFilter();
                filter.type = 'peaking';
                filter.frequency.value = freq;
                filter.Q.value = 2; 
                filter.gain.value = 0; 

                if (index === 0) {
                    eqBus.connect(filter);
                } else {
                    eqFilters[index - 1].connect(filter);
                }
                eqFilters.push(filter);

                const bandDiv = document.createElement('div');
                bandDiv.className = 'eq-band';

                // GAIN
                const gainGroup = document.createElement('div');
                gainGroup.className = 'input-group';
                const gainLabel = document.createElement('div');
                gainLabel.className = 'eq-param-label';
                gainLabel.innerText = 'Gain';
                const gainInput = document.createElement('input');
                gainInput.type = 'number';
                gainInput.className = 'eq-input';
                gainInput.step = '0.1';
                gainInput.value = '0.0';
                gainGroup.appendChild(gainLabel);
                gainGroup.appendChild(gainInput);

                // SLIDER
                const sliderWrap = document.createElement('div');
                sliderWrap.className = 'eq-slider-wrapper';
                const slider = document.createElement('input');
                slider.type = 'range';
                slider.className = 'vertical-slider';
                slider.min = -24;
                slider.max = 24;
                slider.step = 0.1;
                slider.value = 0;
                slider.setAttribute('orient', 'vertical');
                sliderWrap.appendChild(slider);

                // FREQUENCY
                const freqGroup = document.createElement('div');
                freqGroup.className = 'input-group';
                const freqLabel = document.createElement('div');
                freqLabel.className = 'eq-param-label';
                freqLabel.innerText = 'Freq';
                const freqInput = document.createElement('input');
                freqInput.type = 'number';
                freqInput.className = 'eq-input';
                freqInput.value = freq;
                freqGroup.appendChild(freqLabel);
                freqGroup.appendChild(freqInput);

                // Q FACTOR
                const qGroup = document.createElement('div');
                qGroup.className = 'input-group';
                const qLabel = document.createElement('div');
                qLabel.className = 'eq-param-label';
                qLabel.innerText = 'Q';
                const qInput = document.createElement('input');
                qInput.type = 'number';
                qInput.className = 'eq-input';
                qInput.step = '0.1';
                qInput.value = '2.0';
                qGroup.appendChild(qLabel);
                qGroup.appendChild(qInput);

                // --- EVENT LISTENERS ---
                // We removed the setTargetAtTime delay when stopped to ensure instant parameter updates
                
                slider.addEventListener('input', (e) => {
                    const val = parseFloat(e.target.value);
                    filter.gain.value = val; 
                    gainInput.value = val.toFixed(1);
                    drawEQCurve();
                });

                gainInput.addEventListener('input', (e) => {
                    const val = parseFloat(e.target.value);
                    if(!isNaN(val)) {
                        filter.gain.value = val;
                        slider.value = val;
                        drawEQCurve();
                    }
                });

                freqInput.addEventListener('input', (e) => {
                    const val = parseFloat(e.target.value);
                    if(!isNaN(val) && val > 0) {
                        filter.frequency.value = val;
                        drawEQCurve();
                    }
                });

                qInput.addEventListener('input', (e) => {
                    const val = parseFloat(e.target.value);
                    if(!isNaN(val) && val >= 0) {
                        filter.Q.value = val;
                        drawEQCurve();
                    }
                });

                bandDiv.appendChild(gainGroup);
                bandDiv.appendChild(sliderWrap);
                bandDiv.appendChild(freqGroup);
                bandDiv.appendChild(qGroup);
                eqSliders.appendChild(bandDiv);
            });

            eqFilters[eqFilters.length - 1].connect(audioContext.destination);

            // --- RESPONSIVE GRAPH LOGIC & DRAWING ---
            
            function resizeCanvas() {
                canvas.width = canvas.clientWidth;
                canvas.height = canvas.clientHeight;
                drawEQCurve();
            }

            window.addEventListener('resize', resizeCanvas);

            function drawEQCurve() {
                const width = canvas.width;
                const height = canvas.height;
                ctx.clearRect(0, 0, width, height);

                const PAD_LEFT = 45;
                const PAD_RIGHT = 15;
                const PAD_TOP = 15;
                const PAD_BOTTOM = 25;

                const plotWidth = width - PAD_LEFT - PAD_RIGHT;
                const plotHeight = height - PAD_TOP - PAD_BOTTOM;

                if (plotWidth <= 0 || plotHeight <= 0) return;

                const maxDb = 24; 
                const minDb = -24;

                // 1. Draw Y-axis
                ctx.font = '11px monospace';
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';

                const yLabels = [24, 12, 0, -12, -24];
                yLabels.forEach(db => {
                    const y = PAD_TOP + plotHeight - ((db - minDb) / (maxDb - minDb)) * plotHeight;
                    ctx.fillStyle = db === 0 ? '#00ccff' : '#888';
                    ctx.fillText((db > 0 ? '+' : '') + db + ' dB', PAD_LEFT - 5, y);

                    ctx.beginPath();
                    ctx.strokeStyle = db === 0 ? '#555' : '#222';
                    ctx.lineWidth = 1;
                    ctx.moveTo(PAD_LEFT, y);
                    ctx.lineTo(PAD_LEFT + plotWidth, y);
                    ctx.stroke();
                });

                // 2. Draw X-axis
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillStyle = '#888';

                EQ_FREQS.forEach(freq => {
                    const logRatio = Math.log(freq / MIN_FREQ) / Math.log(MAX_FREQ / MIN_FREQ);
                    const x = PAD_LEFT + plotWidth * logRatio;
                    const labelText = freq >= 1000 ? (freq / 1000) + 'k' : freq;
                    ctx.fillText(labelText, x, PAD_TOP + plotHeight + 5);

                    ctx.beginPath();
                    ctx.strokeStyle = '#222';
                    ctx.lineWidth = 1;
                    ctx.moveTo(x, PAD_TOP);
                    ctx.lineTo(x, PAD_TOP + plotHeight);
                    ctx.stroke();
                });

                // 3. Draw Curve
                const numPoints = Math.floor(plotWidth);
                const freqs = new Float32Array(numPoints);
                const totalMag = new Float32Array(numPoints);
                totalMag.fill(1.0);

                for (let i = 0; i < numPoints; i++) {
                    const ratio = i / (numPoints - 1);
                    freqs[i] = MIN_FREQ * Math.pow(MAX_FREQ / MIN_FREQ, ratio);
                }

                // Catch if audioContext isn't fully ready yet (prevents crash before resume)
                try {
                    eqFilters.forEach(filter => {
                        const magResponse = new Float32Array(numPoints);
                        const phaseResponse = new Float32Array(numPoints);
                        filter.getFrequencyResponse(freqs, magResponse, phaseResponse);
                        for (let i = 0; i < numPoints; i++) {
                            totalMag[i] *= magResponse[i];
                        }
                    });
                } catch(e) {
                    // AudioContext not ready, silently fail and draw flat line
                }

                ctx.beginPath();
                ctx.strokeStyle = '#00ccff';
                ctx.lineWidth = 2;

                for (let i = 0; i < numPoints; i++) {
                    let db = 20 * Math.log10(totalMag[i]);
                    // Handle infinity/NaN cases from uninitialized audioContext
                    if (!isFinite(db)) db = 0; 
                    db = Math.max(minDb, Math.min(maxDb, db));

                    const x = PAD_LEFT + i;
                    const y = PAD_TOP + plotHeight - ((db - minDb) / (maxDb - minDb)) * plotHeight;

                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                
                ctx.lineTo(PAD_LEFT + plotWidth, PAD_TOP + plotHeight);
                ctx.lineTo(PAD_LEFT, PAD_TOP + plotHeight);
                ctx.closePath();
                ctx.fillStyle = 'rgba(0, 204, 255, 0.15)';
                ctx.fill();
                ctx.stroke();
            }

            resizeCanvas();

            // Generator Event Listeners
            startButton.addEventListener('click', startGenerator);
            destroyButton.addEventListener('click', stopGenerator);
            toggleOsc2.addEventListener('sl-change', handleOsc2Toggle);
            sliderOsc1.addEventListener('sl-input', () => updateFrequency(1));
            sliderOsc2.addEventListener('sl-input', () => updateFrequency(2));
            sliderVol1.addEventListener('sl-input', () => updateVolume(1));
            sliderVol2.addEventListener('sl-input', () => updateVolume(2));

            function getLogFrequency(sliderValue) {
                const x = sliderValue / 1000;
                return MIN_FREQ * Math.pow(MAX_FREQ / MIN_FREQ, x);
            }

            function formatFrequency(freq) {
                if (freq >= 1000) return (freq / 1000).toFixed(2) + " kHz";
                return freq.toFixed(1) + " Hz";
            }

            function updateFrequency(oscNumber) {
                if (oscNumber === 1) {
                    const freq = getLogFrequency(sliderOsc1.value);
                    labelOsc1.innerText = formatFrequency(freq);
                    if (isPlaying && osc1) osc1.frequency.setTargetAtTime(freq, audioContext.currentTime, 0.05);
                } else if (oscNumber === 2) {
                    const freq = getLogFrequency(sliderOsc2.value);
                    labelOsc2.innerText = formatFrequency(freq);
                    if (isPlaying && osc2) osc2.frequency.setTargetAtTime(freq, audioContext.currentTime, 0.05);
                }
            }

            function updateVolume(oscNumber) {
                if (oscNumber === 1) {
                    labelVol1.innerText = sliderVol1.value + "%";
                    if (isPlaying && gain1) {
                        const vol = (sliderVol1.value / 100) * 0.5; 
                        gain1.gain.setTargetAtTime(vol, audioContext.currentTime, 0.05);
                    }
                } else if (oscNumber === 2) {
                    labelVol2.innerText = sliderVol2.value + "%";
                    if (isPlaying && gain2) {
                        const vol = (sliderVol2.value / 100) * 0.5;
                        gain2.gain.setTargetAtTime(vol, audioContext.currentTime, 0.05);
                    }
                }
            }

            function startOscillator2Logic() {
                osc2 = audioContext.createOscillator();
                gain2 = audioContext.createGain();
                
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(getLogFrequency(sliderOsc2.value), audioContext.currentTime);
                gain2.gain.setValueAtTime((sliderVol2.value / 100) * 0.5, audioContext.currentTime);
                
                osc2.connect(gain2);
                gain2.connect(eqBus); 
                osc2.start();
            }

            function handleOsc2Toggle() {
                if (toggleOsc2.checked) {
                    osc2Controls.style.display = 'flex';
                    if (isPlaying) startOscillator2Logic();
                } else {
                    osc2Controls.style.display = 'none';
                    if (isPlaying && osc2) {
                        osc2.stop();
                        osc2.disconnect();
                        gain2.disconnect();
                        osc2 = null;
                        gain2 = null;
                    }
                }
            }
            
            async function startGenerator() {
                if (isPlaying) return;
                
                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                }
                
                isPlaying = true;

                osc1 = audioContext.createOscillator();
                gain1 = audioContext.createGain();
                
                osc1.type = 'sine'; 
                osc1.frequency.setValueAtTime(getLogFrequency(sliderOsc1.value), audioContext.currentTime);
                gain1.gain.setValueAtTime((sliderVol1.value / 100) * 0.5, audioContext.currentTime);
                
                osc1.connect(gain1);
                gain1.connect(eqBus); 
                osc1.start();

                if (toggleOsc2.checked) {
                    startOscillator2Logic();
                }

                startButton.style.display = 'none';
                destroyButton.style.display = 'block';
            }

            function stopGenerator() {
                if (!isPlaying) return;
                isPlaying = false;

                if (osc1) { osc1.stop(); osc1.disconnect(); osc1 = null; }
                if (gain1) { gain1.disconnect(); gain1 = null; }
                
                if (osc2) { osc2.stop(); osc2.disconnect(); osc2 = null; }
                if (gain2) { gain2.disconnect(); gain2 = null; }

                startButton.style.display = 'block';
                destroyButton.style.display = 'none';
            }
            
            updateFrequency(1);
            updateFrequency(2);
            updateVolume(1);
            updateVolume(2);
        </script>
    </body>
</html>
